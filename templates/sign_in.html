<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
<link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <form action="/signin" method="POST">

        <h2>Sign In</h2>

        <input type="email"
               name="email"
               placeholder="Enter Email">

        <input type="password"
               name="password"
               placeholder="Enter Password">

        <button type="submit">Sign In</button>

        <p class="error">{{ mgs }}</p>

        <p class="signup-text">
        Don't have an account?
        <a href="/">Create accout</a>
    </p>
    </form>

</body>
</html>
