<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin_dashboard.css') }}">

</head>

<body>

    <nav class="navbar">

        <h2>Food Delivery Admin 👨‍💼</h2>

        <a href="{{ url_for('admin_logout') }}">
            Logout
        </a>

    </nav>


    <div class="dashboard">

        <h1>Admin Dashboard</h1>

        <p>Welcome Admin 👋</p>


        <div class="cards">

            <div class="card">

                <h2>👥</h2>

                <h3>Total Users</h3>

                <p>{{ total_users }}</p>

            </div>


            <div class="card">

                <h2>📦</h2>

                <h3>Total Orders</h3>

                <p>{{ total_orders }}</p>

            </div>


            <div class="card">

                <h2>🍔</h2>

                <h3>Total Products</h3>

                <p>{{ total_products }}</p>

            </div>


            <div class="card">

                <h2>💰</h2>

                <h3>Total Sales</h3>

                <p>₹{{ total_sales }}</p>

            </div>

        </div>


        <div class="menu">

            <a href="{{ url_for('admin_orders') }}">

                📦 Manage Orders

            </a>


            <a href="#">

                👥 View Users

            </a>


            <a href="#">

                🍔 Manage Products

            </a>

        </div>

    </div>

</body>

</html>
